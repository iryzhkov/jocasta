name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check test cross
      - run: docker build --build-arg COMMIT="$GITHUB_SHA" -t jocasta:test .
      - name: Retain the checked image for explicit deployment
        run: docker save jocasta:test -o "$RUNNER_TEMP/jocasta-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jocasta-image
          path: ${{ runner.temp }}/jocasta-image.tar
          compression-level: 0
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release VERSION="${GITHUB_REF_NAME#v}" COMMIT="$GITHUB_SHA"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Jocasta $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
